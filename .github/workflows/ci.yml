# Continuous integration workflow
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  run:
    name: CI
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system:
          - ubuntu-24.04
          - windows-latest
          # Spice only ships arm64 builds for macOS, so an Apple Silicon runner is required
          - macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: npm install
        run: npm install

      - name: Lint
        run: npm run format-check
        if: startsWith(matrix.operating-system, 'ubuntu')

      - name: npm test
        run: npm test

      - name: Setup Spice - Linux / macOS
        if: ${{ !startsWith(matrix.operating-system, 'windows') }}
        run: npm run start

      - name: Setup Spice - Windows
        if: startsWith(matrix.operating-system, 'windows')
        run: npm run start:win

      - name: Compile test file
        working-directory: media
        run: spice run ./test-file.spice

      - name: audit packages
        run: npm audit --audit-level=high
        if: startsWith(matrix.operating-system, 'ubuntu')
