name: Licensed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-slim
    name: Check licenses
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Install licensed
        run: |
          mkdir -p "$RUNNER_TEMP/licensed"
          cd "$RUNNER_TEMP/licensed"
          curl -Lfs -o licensed.tar.gz https://github.com/github/licensed/releases/download/3.9.1/licensed-3.9.1-linux-x64.tar.gz
          tar -xzf licensed.tar.gz
          echo "$RUNNER_TEMP/licensed" >> "$GITHUB_PATH"

      - name: Check licendes status
        run: licensed status